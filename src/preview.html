<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL 工作区</title>
<style>
  /*
   * The SQL workspace, drawn by the page itself (D-1097). Colours come from
   * the host's resolved tokens (D-1042/D-1043) and corners from the host's
   * ladder (D-1099); the page's own palette only stands in for an older host.
   * One header band carries the document and its actions, one toolbar carries
   * the two layout choices, and the editor shares the rest with the findings
   * rail.
   */
  :root {
    color-scheme: light;
    --bg: var(--mp-surface-solid, #f6f2ea);
    --surface: var(--mp-surface-raised, #fbf8f2);
    --ink: var(--mp-ink, #241f19);
    --muted: var(--mp-ink-soft, #776b5c);
    --line: var(--mp-line, rgba(60, 45, 25, 0.16));
    --accent: var(--mp-accent, #9a5427);
    --accent-ink: var(--mp-accent-ink, #fff8ef);
    --danger: var(--mp-danger, #b65b36);
    --success: var(--mp-success, #4d7a3a);
    --focus: color-mix(in srgb, var(--mp-accent, #9a5427) 35%, transparent);
    --editor-bg: var(--mp-code-surface, #ede5d8);
    --editor-ink: var(--mp-code-ink, #2f261e);
    --selection: color-mix(in srgb, var(--editor-ink) 22%, transparent);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    --font: var(--mp-font-body, -apple-system, "PingFang SC", "Segoe UI", sans-serif);
    --tok-keyword: var(--mp-code-keyword, #9c4a15);
    --tok-string: var(--mp-code-string, #476a2f);
    --tok-number: var(--mp-code-number, #855715);
    --tok-property: var(--mp-code-property, #1f6b6a);
    --tok-comment: var(--mp-code-comment, #7d7264);
    --tok-type: var(--mp-code-type, #2d5580);
    --tok-literal: var(--mp-code-literal, #7a3d86);
  }
  :root[data-scheme="dark"] {
    color-scheme: dark;
    --bg: var(--mp-surface-solid, #171412);
    --surface: var(--mp-surface-raised, #201c18);
    --ink: var(--mp-ink, #f0e6d9);
    --muted: var(--mp-ink-soft, #9a8c7b);
    --line: var(--mp-line, rgba(255, 236, 214, 0.14));
    --accent: var(--mp-accent, #e2955f);
    --accent-ink: var(--mp-accent-ink, #241a12);
    --danger: var(--mp-danger, #e89a83);
    --success: var(--mp-success, #9ab57f);
    --focus: color-mix(in srgb, var(--mp-accent, #e2955f) 35%, transparent);
    --editor-bg: var(--mp-code-surface, #241e19);
    --editor-ink: var(--mp-code-ink, #f5ecdf);
    --selection: color-mix(in srgb, var(--editor-ink) 28%, transparent);
    --tok-keyword: var(--mp-code-keyword, #e8a06a);
    --tok-string: var(--mp-code-string, #a7c48a);
    --tok-number: var(--mp-code-number, #e0bd84);
    --tok-property: var(--mp-code-property, #8fc7c4);
    --tok-comment: var(--mp-code-comment, #948675);
    --tok-type: var(--mp-code-type, #a8bede);
    --tok-literal: var(--mp-code-literal, #d3a9df);
  }
  :root {
    --radius-xs: 4px;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-pill: 999px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 13px;
    overflow: hidden;
  }
  button, select { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  .icon { display: block; width: 14px; height: 14px; }

  /* Document header: one 46px band, the name at the left, tools at the right. */
  .doc-head {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 46px;
    padding: 0 10px 0 16px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    flex: none;
  }
  .doc-id {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    flex: 1;
  }
  .doc-icon {
    width: 16px;
    height: 16px;
    flex: none;
    color: var(--accent);
  }
  .doc-kind {
    flex: none;
    padding: 2px 6px;
    border: 1px solid var(--line);
    border-radius: var(--radius-xs);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .doc-title {
    margin: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
    font-weight: 600;
  }
  .doc-actions {
    display: flex;
    align-items: center;
    gap: 2px;
    flex: none;
  }
  .action {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 28px;
    padding: 0 9px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .action:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--ink); }
  .action:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }
  .action.primary {
    background: var(--accent);
    border-color: transparent;
    color: var(--accent-ink);
  }
  .action.primary:hover { background: var(--accent); filter: brightness(1.06); color: var(--accent-ink); }
  .action.toggle[aria-pressed="true"] {
    background: var(--accent);
    color: var(--accent-ink);
  }
  .action.toggle[aria-pressed="true"]:hover {
    background: var(--accent);
    filter: brightness(1.06);
    color: var(--accent-ink);
  }
  .action[disabled] { opacity: 0.45; cursor: default; }
  .doc-close {
    margin-left: 4px;
    padding-left: 10px;
    border-left: 1px solid var(--line);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  }
  .doc-close .icon { width: 13px; height: 13px; }
  /* A menu page sits inside the host's tab and canvas (D-1234): closing the
     window is the host's own control, and a second X would do the same thing
     from inside the page. */
  body[data-mode="menu"] .doc-close { display: none; }

  /* Toolbar: the layout choices, one row of 28px controls. */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 40px;
    padding: 0 16px;
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--surface) 55%, var(--bg));
    flex: none;
    flex-wrap: wrap;
  }
  .field {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .field select {
    height: 26px;
    padding: 0 22px 0 8px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--ink);
    font-size: 11px;
    font-weight: 500;
  }
  .field select:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }
  .toolbar-note {
    color: var(--muted);
    font-size: 11px;
  }
  .toolbar-spacer { flex: 1; }
  .counts {
    color: var(--muted);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* The editor and the findings rail share the rest of the frame. */
  .workspace {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(220px, 264px);
    gap: 10px;
    margin: 12px 14px 0;
  }
  .editor-pane {
    display: flex;
    min-width: 0;
    min-height: 0;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--editor-bg);
    overflow: hidden;
    position: relative;
  }
  .gutter {
    width: 48px;
    flex: none;
    padding: 12px 6px 12px 0;
    border-right: 1px solid var(--line);
    background: color-mix(in srgb, var(--editor-bg) 80%, var(--surface));
    overflow: hidden;
    user-select: none;
  }
  .gutter-inner {
    font-family: var(--mono);
    font-size: 12px;
    line-height: 21px;
    text-align: right;
    color: color-mix(in srgb, var(--editor-ink) 38%, transparent);
  }
  .gutter-line { height: 21px; }
  .gutter-line.error {
    color: var(--danger);
    font-weight: 700;
  }
  .code-surface {
    position: relative;
    flex: 1;
    min-width: 0;
    overflow: hidden;
  }
  .highlight,
  .code-input {
    position: absolute;
    inset: 0;
    margin: 0;
    padding: 12px 16px 24px;
    border: 0;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 21px;
    tab-size: 2;
    /* Wrapping is the default; the head's toggle turns it off. */
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }
  :root[data-wrap="off"] .highlight,
  :root[data-wrap="off"] .code-input {
    white-space: pre;
    overflow-wrap: normal;
  }
  .highlight {
    overflow: hidden;
    color: var(--editor-ink);
    pointer-events: none;
  }
  .code-input {
    resize: none;
    overflow: auto;
    background: transparent;
    color: transparent;
    caret-color: var(--editor-ink);
  }
  .code-input::selection {
    background: var(--selection);
    color: transparent;
  }
  .code-input:focus { outline: none; }
  .code-input::placeholder { color: color-mix(in srgb, var(--editor-ink) 42%, transparent); }
  .tok-keyword { color: var(--tok-keyword); font-weight: 600; }
  .tok-type { color: var(--tok-type); }
  .tok-literal { color: var(--tok-literal); }
  .tok-function { color: var(--tok-property); }
  .tok-property { color: var(--tok-property); }
  .tok-string { color: var(--tok-string); }
  .tok-number { color: var(--tok-number); }
  .tok-comment { color: var(--tok-comment); font-style: italic; }
  .tok-error {
    text-decoration: underline wavy var(--danger);
    text-underline-offset: 3px;
  }

  /* Findings rail: a quiet header, one card row per problem. */
  .problems {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--bg);
    overflow: hidden;
  }
  .problems-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-height: 34px;
    padding: 0 12px;
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  .problems-title {
    margin: 0;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .problem-count {
    min-width: 20px;
    padding: 1px 6px;
    border-radius: var(--radius-pill);
    background: color-mix(in srgb, var(--ink) 8%, transparent);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .problem-count.bad {
    background: color-mix(in srgb, var(--danger) 16%, transparent);
    color: var(--danger);
  }
  .problems-body {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    min-height: 0;
    padding: 8px;
    overflow: auto;
  }
  .problem-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .problem-row {
    display: flex;
    flex-direction: column;
    gap: 2px;
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--surface);
    text-align: left;
  }
  .problem-row:hover { border-color: color-mix(in srgb, var(--ink) 26%, transparent); }
  .problem-row:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }
  .problem-where {
    color: var(--danger);
    font-family: var(--mono);
    font-size: 10px;
    font-variant-numeric: tabular-nums;
  }
  .problem-message {
    color: var(--ink);
    font-size: 11px;
    line-height: 1.45;
    overflow-wrap: anywhere;
  }
  .problems-empty {
    margin: auto;
    padding: 16px 12px;
    color: var(--muted);
    font-size: 11px;
    text-align: center;
  }
  .problems-note {
    margin: 0;
    padding: 7px 9px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 11px;
    line-height: 1.45;
    flex: none;
  }

  /* Status bar: what the last action said, the first finding, the caret. */
  .statusbar {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 30px;
    padding: 0 16px;
    border-top: 1px solid var(--line);
    margin-top: 8px;
    color: var(--muted);
    font-size: 11px;
    flex: none;
  }
  .status.ok { color: var(--success); }
  .status.bad { color: var(--danger); }
  .status-right {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-left: auto;
    min-width: 0;
  }
  .finding {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--danger);
  }
  .finding.clean { color: var(--muted); }
  #position {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @media (max-width: 720px) {
    .workspace {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) minmax(112px, 34%);
      gap: 8px;
    }
    .toolbar-note { display: none; }
  }
  @media (max-height: 520px) {
    .doc-head { height: 40px; }
    .toolbar { min-height: 34px; }
    .statusbar { min-height: 26px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .action { transition: background-color 120ms ease, color 120ms ease; }
  }
</style>
</head>
<body>
  <header class="doc-head">
    <div class="doc-id">
      <svg class="doc-icon" viewBox="0 0 20 20" aria-hidden="true">
        <ellipse cx="10" cy="4.8" rx="6.4" ry="2.6" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M3.6 4.8v10.4c0 1.4 2.9 2.6 6.4 2.6s6.4-1.2 6.4-2.6V4.8" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M3.6 10c0 1.4 2.9 2.6 6.4 2.6s6.4-1.2 6.4-2.6" fill="none" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <span class="doc-kind">SQL</span>
      <h1 class="doc-title" id="doc-title">等待条目…</h1>
    </div>
    <div class="doc-actions">
      <button type="button" class="action primary" id="format" title="按 SQL Style Guide 美化（⌘⇧F）" aria-label="美化 SQL">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2 4h7M2 8h5M2 12h9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M12.2 3.2 12.8 5l1.8.6-1.8.6-.6 1.8-.6-1.8L9.8 5.6l1.8-.6z" fill="currentColor"/>
        </svg>
        <span class="action-label">美化</span>
      </button>
      <button type="button" class="action" id="compress" title="压缩为一行" aria-label="压缩为一行">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3 4h10M3 12h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M6.5 6.5 8 8l1.5-1.5M6.5 9.5 8 8l1.5 1.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="action-label">压缩</span>
      </button>
      <button type="button" class="action" id="copy" title="复制当前内容" aria-label="复制当前内容">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="5.5" y="5.5" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path d="M10.5 3.5v-.5A1.5 1.5 0 0 0 9 1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <span class="action-label">复制</span>
      </button>
      <button type="button" class="action toggle" id="wrap-toggle" aria-pressed="true"
        title="长行在面板内自动换行；关闭后横向滚动" aria-label="自动换行">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2 4.4h12M2 11.6h5.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M10.2 9.2 12.4 11.6l-2.2 2.4M12.4 11.6H8.6" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="action-label">换行</span>
      </button>
      <button type="button" class="action doc-close" id="close" title="关闭" aria-label="关闭">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="m4 4 8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="toolbar" role="group" aria-label="SQL 排版选项">
    <label class="field">方言
      <select id="dialect" aria-label="SQL 方言"></select>
    </label>
    <label class="field">目标行宽
      <select id="width" aria-label="目标行宽">
        <option value="80" selected>80 列</option>
        <option value="100">100 列</option>
        <option value="120">120 列</option>
      </select>
    </label>
    <span class="toolbar-note">关键字大写、子句右对齐，按 SQL Style Guide</span>
    <span class="toolbar-spacer"></span>
    <span class="counts" id="counts">0 行</span>
  </div>

  <main class="workspace">
    <div class="editor-pane">
      <div class="gutter" id="gutter" aria-hidden="true"><div class="gutter-inner" id="gutter-inner"></div></div>
      <div class="code-surface">
        <pre class="highlight" id="highlight" aria-hidden="true"></pre>
        <textarea class="code-input" id="editor" spellcheck="false" autocomplete="off"
          autocapitalize="off" wrap="soft" placeholder="打开一条 SQL 条目后，在这里编辑。"
          aria-label="SQL 文本" aria-describedby="status finding"></textarea>
      </div>
    </div>
    <aside class="problems" aria-label="语法问题">
      <div class="problems-head">
        <h2 class="problems-title">问题</h2>
        <span class="problem-count" id="problem-count" aria-label="问题数量">0</span>
      </div>
      <div class="problems-body">
        <p class="problems-empty" id="problem-empty">没有发现语法问题</p>
        <div class="problem-list" id="problem-list" role="list"></div>
      </div>
      <p class="problems-note" id="problem-note" hidden></p>
    </aside>
  </main>

  <footer class="statusbar">
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <div class="status-right">
      <span class="finding clean" id="finding"></span>
      <span id="position">1:1</span>
    </div>
  </footer>

  <p class="sr-only" hidden>美化由 sqlriver 按 SQL Style Guide 完成；高亮、压缩与诊断都在本页进行，不联网，也不执行 SQL。复制由宿主写入剪贴板。</p>
<script>
<!--bundle-->
</script>
</body>
</html>
